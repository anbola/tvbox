name: 自动搜索新源并集成（每周）

on:
  schedule:
    # 每周一 05:00 (UTC+8 13:00)
    - cron: '0 21 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install opencc-python-reimplemented

      - name: 探测候选源可用性
        run: python tools/probe_new_sources.py

      - name: 自愈式刷新直播源
        run: python tools/autoheal_lives.py

      - name: 逐源验证并重建精选点播配置（沿用自愈直播源）
        run: python tools/build_curated.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add lives/ tools/ tvbox_curated.json tvbox_multisource.json tvbox_subscription.json probe_new_sources.json
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore(auto): 每周自动探测新源并集成（$(date +%Y-%m-%d)）"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: 上传探测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-report
          path: probe_new_sources.json
