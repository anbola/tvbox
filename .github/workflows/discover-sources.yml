name: 自动搜索新源并集成（每周）

on:
  schedule:
    # 每周一 05:00 (UTC+8 13:00)
    - cron: '0 21 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install opencc-python-reimplemented

      - name: 探测候选源可用性
        run: python tools/probe_new_sources.py

      - name: 抓取 + 清洗全部直播源
        run: |
          python tools/fetch_raw.py
          python tools/clean_lives.py

      - name: 逐源验证并重建精选配置
        run: python tools/build_curated.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lives/ tvbox_curated.json tools/ probe_new_sources.json
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "chore(auto): 每周自动探测新源并集成（$(date +%Y-%m-%d)）"
            git push
          fi

      - name: 上传到仓库
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-probe-report
          path: probe_new_sources.json
