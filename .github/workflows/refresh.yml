name: 直播源候选池更新（每周六 21:30）

# 云端只做【抓取 + 结构校验 + 提交候选池】。
# ⚠️ 测速必须在你自己电脑上跑：GitHub 服务器在国外，测中国移动 IPTV 无意义。
#    所以本工作流**不会**覆盖 lives/main.m3u 和 tvbox_clean.json，
#    只把各社区源合并进候选池 lives/pool.m3u，供本地 refresh.bat 测速时使用。
#
# 时间为什么改了：原来是每天 04:00。那个点抓下来的池子，要等到晚上你回家
# 才有机会测速，等于白等一整天；而你白天上班、只有晚上和周末在家，凌晨那次
# 更新对你没有任何可见收益。改成每周六 21:30 —— 周末全网最闲、你在家，
# 抓完顺手跑一次 refresh.bat，周中不再打扰。候选池本来就是"只增不减"的，
# 一周补一次完全够用。

on:
  schedule:
    - cron: "30 13 * * 6"   # 每周六 21:30（北京时间 = UTC 13:30）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "lives/**"
      - "tvbox_clean.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ① 抓取：各社区源 → 合并进候选池（只扩充，绝不覆盖 main.m3u）
      # 不再 continue-on-error 静默吞失败：抓取失败必须留下可见告警，
      # 否则会出现「工作流全绿、但候选池其实几个月没更新」的假健康。
      - name: 抓取并合并候选池
        id: pool
        run: python tools/merge_pool.py

      - name: 源抓取失败告警
        if: failure() && steps.pool.outcome == 'failure'
        run: |
          echo "::warning::候选池抓取失败（上游源可能失效），本次不更新 pool.m3u；详见上方的 ✗ 行"
          echo "建议在 tools/merge_pool.py 的 SOURCES 里替换掉 ✗ 的上游地址"

      # ② 筛选（结构级）：配置合法 + m3u 合法，防止把坏文件推上线
      - name: 校验产物
        run: |
          python - <<'PY'
          import json
          cfg = json.load(open("tvbox_clean.json", encoding="utf-8"))
          assert cfg.get("sites"), "sites 不能为空"
          for s in cfg["sites"]:
              assert s.get("api", "").startswith("http"), "api 非法: %r" % s.get("api")
              # key/type/api 缺任一，TVBoxOSC 会静默跳过该站（首页少站、不报错）
              assert s.get("key"), "站点缺 key，TVBox 会静默跳过"
              assert s.get("type") == 1, "站点 type 必须为 1（json 采集）"
              assert "ext" not in s, "不应有 ext 字段"
              assert "ac=videolist" not in s["api"], "api 不应焊死 ac=videolist"
          assert cfg.get("lives"), "lives 不能为空"
          # ★ lives 字段规范：写错就是「点播正常、直播空白」（2026-11-04 实测踩过）
          #   type 必须整数 0(M3U)；playerType 必须整数；不能有 url2 等非法字段。
          #   备用源靠 lives 数组放多个对象，不是写在同一个对象里。
          for lv in cfg["lives"]:
              assert lv.get("type") == 0, "lives.type 必须为整数 0: %r" % lv.get("name")
              assert isinstance(lv.get("playerType"), int), \
                     "playerType 必须是整数（字符串会让部分分支丢弃整段 lives）: %r" % lv.get("name")
              assert "url2" not in lv, "lives 不支持 url2 字段，请改用数组第二个对象"
              assert str(lv.get("url","")).startswith("http"), "lives.url 非法"
          for fn, lo in (("lives/main.m3u", 60), ("lives/public.m3u", 20)):
              import os
              if not os.path.exists(fn):
                  print("跳过（不存在）:", fn); continue
              txt = open(fn, encoding="utf-8").read()
              assert txt.startswith("#EXTM3U"), "%s 头非法" % fn
              n = txt.count("#EXTINF")
              assert n > lo, "%s 频道太少: %d" % (fn, n)
              bad = [l for l in txt.splitlines()
                     if l and not l.startswith("#") and not l.startswith("http")]
              assert not bad, "%s 存在非法行: %r" % (fn, bad[:3])
              assert not any(ord(c) > 0xFFFF for c in txt), "%s 含 emoji" % fn
              print("校验通过: %s 频道=%d" % (fn, n))
          print("校验通过: sites=%d lives=%d" % (len(cfg["sites"]), len(cfg["lives"])))
          PY

      # ③ 更新：只在候选池有变化时提交
      - name: 提交变更
        run: |
          git config user.name  "tvbox-bot"
          git config user.email "bot@users.noreply.github.com"
          git config pull.rebase true
          git add lives/pool.m3u
          if git diff --staged --quiet; then
            echo "候选池无变化"
          else
            git commit -m "chore(auto): 候选池更新 $(date +%Y-%m-%d)"
            git pull --rebase --autostash origin main || true
            git push
          fi
