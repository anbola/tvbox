name: 更新直播源（每日·自愈）

on:
  schedule:
    # 每天 05:30 (UTC+8 13:30) 自动重跑
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install opencc-python-reimplemented

      - name: 自愈式刷新直播源（探测 19 源 → 清洗 → 取最健康 10 源）
        run: python tools/autoheal_lives.py

      - name: 合并 MyTV 订阅源（10 源 → mytv.m3u）
        run: python tools/make_mytv.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git add lives/ tools/lives/ tools/make_mytv.py tvbox_curated.json tvbox_multisource.json tvbox_subscription.json tvbox_lives.json mytv.m3u
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(auto): 自愈刷新直播源（$(date +%Y-%m-%d)）"
            git pull --rebase --autostash origin main
            git push
          fi
